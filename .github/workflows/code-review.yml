name: Code Review Trigger

# Asks the private twin (claude-agent-scaffolding-internal) to run the custom
# code review agent on the self-hosted Mac mini.
#
# This repository is PUBLIC and cannot use the self-hosted runner: the org
# runner group sets allows_public_repositories: false. That is deliberate.
# This job runs on a GitHub-hosted runner, which is free for public repos.

on:
  pull_request_target:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: code-review-trigger-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dispatch:
    name: Request code review
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - name: Mint a scoped App token
        id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.PULSEAI_DISPATCH_APP_ID }}
          private-key: ${{ secrets.PULSEAI_DISPATCH_PRIVATE_KEY }}
          owner: pulseai-labs
          repositories: claude-agent-scaffolding-internal
          permission-actions: write

      - name: Dispatch to claude-agent-scaffolding-internal
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR: ${{ github.event.pull_request.number || 0 }}
        run: |
          set -euo pipefail
          printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::bad sha"; exit 1; }
          printf '%s' "$PR"  | grep -Eq '^[0-9]{1,10}$'  || { echo "::error::bad pr"; exit 1; }
          gh api -X POST             /repos/pulseai-labs/claude-agent-scaffolding-internal/actions/workflows/droid.yml/dispatches             -f ref=main             -f "inputs[sha]=$SHA"             -f "inputs[pr]=$PR"
          echo "requested code review for $SHA (PR #$PR)"

      - name: Note where the result appears
        run: |
          echo "Code review runs in claude-agent-scaffolding-internal and comments back on this PR." >>"$GITHUB_STEP_SUMMARY"
          echo "Run log: https://github.com/pulseai-labs/claude-agent-scaffolding-internal/actions" >>"$GITHUB_STEP_SUMMARY"