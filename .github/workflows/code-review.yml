name: Code Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  code-review:
    uses: pulseai-labs/ci-automation/.github/workflows/droid.yml@29ae416d7fa5a0258c641d835eec81681ade7e07
    with:
      automations: code-review
      runner: ubuntu-latest
      target-repo: draco28/claude-agent-scaffolding
      target-ref: ${{ github.event.pull_request.head.sha }}
      comment-on: draco28/claude-agent-scaffolding
      comment-issue: ${{ github.event.pull_request.number }}
    secrets:
      zai_api_key: ${{ secrets.ZAI_API_KEY }}