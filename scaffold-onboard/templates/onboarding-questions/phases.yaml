phases:
  - id: 1
    name: foundation
    title: "Foundation"
    role: "Product Manager"
    subsections:
      - id: "1.1"
        title: "Vision & Problem"
        questions:
          - id: "1.1.1"
            text: "One-sentence elevator pitch: what are you building?"
            required: true
          - id: "1.1.2"
            text: "What problem does this solve, and for whom?"
            required: true
          - id: "1.1.3"
            text: "What does success look like 6 months from launch?"
            required: false
      - id: "1.2"
        title: "Users & Use cases"
        questions:
          - id: "1.2.1"
            text: "Who are the primary users (1–3 personas, brief)?"
            required: true
          - id: "1.2.2"
            text: "The single core use case that, if missing, the product fails?"
            required: true
      - id: "1.3"
        title: "Project class & MVP"
        questions:
          - id: "1.3.1"
            text: "Project class — pick one"
            required: true
            enum:
              - "CLI tool"
              - "Library or SDK"
              - "Web app"
              - "Web service (API only)"
              - "Mobile app"
              - "ML or AI system"
              - "Agent or plugin"
              - "Data pipeline"
              - "Other"
          - id: "1.3.2"
            text: "MVP cut — smallest thing that demos value end-to-end?"
            required: true

  - id: 2
    name: strategy
    title: "Strategy"
    role: "Strategic Planner"
    subsections:
      - id: "2.1"
        title: "Timeline & Resources"
        questions:
          - id: "2.1.1"
            text: "Target weeks-to-MVP?"
            required: true
          - id: "2.1.2"
            text: "Who's building (solo / team size)?"
            required: true
      - id: "2.2"
        title: "Constraints"
        questions:
          - id: "2.2.1"
            text: "Monthly budget cap for hosting / APIs / services (USD)?"
            required: false
          - id: "2.2.2"
            text: "Top 3 risks (tech / market / resource)?"
            required: true
      - id: "2.3"
        title: "Success"
        questions:
          - id: "2.3.1"
            text: "How will you know it works — one metric, signal, or proof?"
            required: true

  - id: 3
    name: domain_and_data_model
    title: "Domain & Data Model"
    role: "Domain Modeler"
    subsections:
      - id: "3.1"
        title: "Core entities"
        questions:
          - id: "3.1.1"
            text: "3–7 core entities/objects in your domain?"
            required: true
          - id: "3.1.2"
            text: "For each entity: identity (key) + one-line description?"
            required: true
      - id: "3.2"
        title: "Relationships"
        questions:
          - id: "3.2.1"
            text: "Key relationships (one-to-many, many-to-many, hierarchies)?"
            required: true
          - id: "3.2.2"
            text: "Aggregates or invariants — what must stay consistent together?"
            required: false
      - id: "3.3"
        title: "Ubiquitous language"
        questions:
          - id: "3.3.1"
            text: "Domain terms to keep consistent across code & docs?"
            required: false

  - id: 4
    name: security_and_compliance
    title: "Security & Compliance"
    role: "Security Engineer"
    subsections:
      - id: "4.1"
        title: "Sensitivity"
        questions:
          - id: "4.1.1"
            text: "Handles PII / health / financial / payment data? (none / which)"
            required: true
          - id: "4.1.2"
            text: "Regulated domain (GDPR / HIPAA / SOC 2 / PCI-DSS / other)?"
            required: false
      - id: "4.2"
        title: "Auth & access"
        questions:
          - id: "4.2.1"
            text: "Auth model: none / API keys / OAuth / SSO / custom?"
            required: true
          - id: "4.2.2"
            text: "Multi-tenant or single-tenant?"
            required: true
      - id: "4.3"
        title: "Threat surface"
        questions:
          - id: "4.3.1"
            text: "External attack surface: public internet / internal / air-gapped?"
            required: true

  - id: 5
    name: architecture
    title: "Architecture"
    role: "System Architect"
    subsections:
      - id: "5.1"
        title: "Shape"
        questions:
          - id: "5.1.1"
            text: "Shape: monolith / modular monolith / services / library / CLI / hybrid?"
            required: true
          - id: "5.1.2"
            text: "Async/event-driven boundaries (queues, batch jobs, streams)?"
            required: false
      - id: "5.2"
        title: "Tech choices"
        questions:
          - id: "5.2.1"
            text: "Primary language(s)?"
            required: true
          - id: "5.2.2"
            text: "Primary data store(s): relational / document / kv / vector / search / file / none?"
            required: true
          - id: "5.2.3"
            text: "External APIs / third-party services in scope?"
            required: false
      - id: "5.3"
        title: "Performance & scale"
        questions:
          - id: "5.3.1"
            text: "Expected scale at 6 months: throughput, concurrent users, data volume?"
            required: false
          - id: "5.3.2"
            text: "Latency targets for hot paths?"
            required: false

  - id: 6
    name: ux_surfaces
    title: "UX / Surfaces"
    role: "UX Designer"
    subsections:
      - id: "6A.1"
        title: "Surfaces"
        gate: "project_class in {Web app, Mobile app, CLI tool, ML or AI system, Agent or plugin, Other}"
        questions:
          - id: "6A.1.1"
            text: "Surfaces: web UI / mobile / CLI / TUI / multiple?"
            required: true
          - id: "6A.1.2"
            text: "Primary user flow from landing to first value (paragraph)?"
            required: true
      - id: "6A.2"
        title: "Standards"
        gate: "project_class in {Web app, Mobile app, CLI tool, ML or AI system, Agent or plugin, Other}"
        questions:
          - id: "6A.2.1"
            text: "Accessibility floor: WCAG 2.1 A / AA / AAA / not in scope?"
            required: false
          - id: "6A.2.2"
            text: "Design system: existing to adopt / build minimal / TBD?"
            required: false
      - id: "6B.1"
        title: "Developer experience"
        gate: "project_class in {Library or SDK, Data pipeline, Web service (API only)}"
        questions:
          - id: "6B.1.1"
            text: "How will users discover and learn the interface? (README / generated API docs / interactive docs / examples-only / other)"
            required: true
          - id: "6B.1.2"
            text: "Error and output style: verbose human-readable / minimal / structured (JSON / structured logs) / mixed?"
            required: true

  - id: 7
    name: implementation_approach
    title: "Implementation Approach"
    role: "Engineer"
    subsections:
      - id: "7.1"
        title: "Decomposition"
        questions:
          - id: "7.1.1"
            text: "Module/package boundaries — how do you decompose?"
            required: true
          - id: "7.1.2"
            text: "Code style: statically typed (which) / dynamic / mixed?"
            required: true
      - id: "7.2"
        title: "Backend"
        gate: "project_class in {Web app, Web service (API only), ML or AI system, Agent or plugin, Data pipeline}"
        questions:
          - id: "7.2.1"
            text: "ORM / query builder / raw SQL — preference?"
            required: false
          - id: "7.2.2"
            text: "API style: REST / GraphQL / RPC / tRPC / N/A?"
            required: false
      - id: "7.3"
        title: "Frontend"
        gate: "project_class in {Web app, Mobile app}"
        questions:
          - id: "7.3.1"
            text: "State management: local / context / library (which) / server-state lib?"
            required: false
      - id: "7.4"
        title: "Library/SDK"
        gate: "project_class == \"Library or SDK\""
        questions:
          - id: "7.4.1"
            text: "Public API surface: what's exported? Versioning approach?"
            required: false

  - id: 8
    name: devops_and_environments
    title: "DevOps & Environments"
    role: "DevOps"
    subsections:
      - id: "8.1"
        title: "Local dev"
        questions:
          - id: "8.1.1"
            text: "Required local tooling (pkg mgr, docker, k8s, nothing fancy)?"
            required: true
          - id: "8.1.2"
            text: "Fresh-dev clone-to-running target time?"
            required: false
      - id: "8.2"
        title: "CI/CD"
        questions:
          - id: "8.2.1"
            text: "CI platform: GitHub Actions / GitLab / CircleCI / Jenkins / none yet?"
            required: false
          - id: "8.2.2"
            text: "Environments: dev-only / dev+staging+prod / preview branches?"
            required: true
      - id: "8.3"
        title: "Hosting"
        questions:
          - id: "8.3.1"
            text: "Hosting target: Vercel / Railway / AWS / GCP / Azure / self-hosted / TBD?"
            required: true

  - id: 9
    name: quality_testing_and_eval
    title: "Quality, Testing & Eval"
    role: "QA Engineer"
    subsections:
      - id: "9.1"
        title: "Test pyramid"
        questions:
          - id: "9.1.1"
            text: "Coverage floor for core logic (% target)?"
            required: true
          - id: "9.1.2"
            text: "Test types in scope: unit / integration / e2e / contract / property?"
            required: true
      - id: "9.2"
        title: "Quality gates"
        questions:
          - id: "9.2.1"
            text: "Pre-merge gates — what must pass to merge a PR?"
            required: true
      - id: "9.3"
        title: "Eval"
        gate: "uses_llm == true"
        questions:
          - id: "9.3.1"
            text: "Uses LLMs / ML models? (yes/no — gates 9.3.2)"
            required: true
          - id: "9.3.2"
            text: "Eval dimensions (groundedness, factuality, latency, cost, format, safety)?"
            required: false

  - id: 10
    name: operations_and_support
    title: "Operations & Support"
    role: "Release/Ops"
    subsections:
      - id: "10.1"
        title: "Rollout"
        questions:
          - id: "10.1.1"
            text: "Rollout strategy: direct / staged / feature flags / canary?"
            required: false
      - id: "10.2"
        title: "Observability"
        questions:
          - id: "10.2.1"
            text: "Logs/metrics/traces destination?"
            required: false
          - id: "10.2.2"
            text: "Alerting target: email / Slack / pager / none?"
            required: false
      - id: "10.3"
        title: "Support model"
        questions:
          - id: "10.3.1"
            text: "Who responds when it breaks — solo / on-call / business hours?"
            required: false
          - id: "10.3.2"
            text: "Deprecation/retirement communication plan?"
            required: false

schema_version: "1.0"
expected_phase_count: 10
expected_question_count: 56
